<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown Checker</title>
</head>
<style>
    body {
        background-image: radial-gradient(pink, pink, white)
    }

    h1 {
        text-align: center;
        color: white;
        font-size: 35px;
        font-family: fantasy, sans-serif;
    }

    h2 {
        text-align: center;
        color: white;
        font-size: 35px;
        font-family: fantasy, sans-serif;
    }

    #party1 {
        text-align: center;
        color: black;
        font-size: 35px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    #party2 {
        text-align: center;
        color: black;
        font-size: 35px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    #greeting {
        text-align: center;
        color: black;
        font-size: 35px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    #days {
        text-align: center;
        color: black;
        font-size: 35px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    #countdown {
        text-align: center;
        color: black;
        font-size: 35px;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
</style>

<body>
    <h1>Birthday Countdown Checker</h1>
    <div id="greeting"></div>
    <h2>Party Details</h2>
    <div id="party1"></div>
    <div id="party2"></div>
    <h2> CountDown 💥 </h2>
    <div id="days"></div>
    <div id="countdown"></div>
    <script>
        let partyName = null;
        let partylocation;
        document.getElementById("party1").innerHTML = "Party Time = " + partyName;
        document.getElementById("party2").innerHTML = "Party Time = " + partylocation;

        let hour = new Date().getHours();

        if (hour < 12) {
            greeting.innerHTML = " Good Morning !!!";
        }
        else if (hour < 18) {
            greeting.innerHTML = " Good AfterNoon!!!";
        }
        else {
            greeting.innerHTML = " Good Evening !!!";
        }
        let partyDate = new Date("December 12 , 2026 17:00:00")

        function updateCountdown() {
            let now = new Date();
            let difference = partyDate - now;

            if (difference <= 0) {
                days.innerHTML = "The Party is Started";
                countdown.innerHTML = "";
                return;
            }
            let totaldays = Math.floor(difference / (1000 * 60 * 60 * 24));
            let hours = Math.floor(difference / (1000 * 60 * 60)) % 60
            let minutes = Math.floor(difference / (1000 * 60)) % 60
            let seconds = Math.floor(difference / (1000)) % 60
            days.innerHTML = totaldays + "Days Left !";
            countdown.innerHTML = hours + "Hours :" + minutes + "Minutes :" + seconds + "Seconds"
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);



    </script>

</body>

</html>
